schemaVersion: "1"

# Common sbx environment (Windows and macOS). The template images are built
# and published by CI (.github/workflows/build.yml -> ghcr.io); sbx pulls them
# directly, so nothing is built on the host. This file alone is the Windows
# setup. On macOS, layer sbxenv.mac.yaml on top for the host-only extras, e.g.:
#   sbx env run sbx-setup/sbxenv.yaml sbx-setup/sbxenv.mac.yaml \
#     --name common-opencode --env-arg workspace=$HOME/projects
# The examples below use the Windows workspace path.
#
#   OpenCode:
#     sbx env run sbx-setup/sbxenv.yaml --name common-opencode \
#       --env-arg workspace=%USERPROFILE%\projects
#
#   Codex:
#     sbx env run sbx-setup/sbxenv.yaml --name common-codex \
#       --env-arg agent=codex \
#       --env-arg template=ghcr.io/kotarotaniguchi0523/common-codex:dev \
#       --env-arg workspace=%USERPROFILE%\projects
#
#   Claude Code (sbxenv.claude.yaml also keeps conversations across recreate):
#     sbx env run sbx-setup/sbxenv.yaml sbx-setup/sbxenv.claude.yaml \
#       --name common-claude --env-arg workspace=%USERPROFILE%\projects
#
# To try a locally built template instead, build and load it yourself
# (`docker buildx bake`, `docker image save`, `sbx template load`; see README)
# and pass `--env-arg template=common-claude:dev --env-arg pullPolicy=never`.

args:
  agent:
    default: opencode
    enum: [opencode, codex, claude]
  template:
    default: ghcr.io/kotarotaniguchi0523/common-opencode:dev
  pullPolicy:
    default: always
    enum: [always, missing, never]
    description: always picks up the latest CI build when the sandbox is created
  workspace:
    default: "."
    description: Host directory to mount as the sandbox workspace

agent: ${{ env.args.agent }}
workspace: ${{ env.args.workspace }}

sandboxOptions:
  template: ${{ env.args.template }}
  pullPolicy: ${{ env.args.pullPolicy }}
  skills: off

# 自作 kit（common-opencode / common-codex / common-claude）が credential@1 で github を
# 宣言しているため、その注入ドメインを承認する（opencode / codex / claude 共通）。
# 承認は host 全体の credentials.yaml にマージされる（sbx env rm でも残る）。
bindings:
  github:
    apiKey:
      domains:
        - api.github.com
        - github.com
        - uploads.github.com
  # cf CLI 用。kit 記述子の credential@1 (service: cloudflare) と対になる承認。
  # 値は未投入（後で: sbx secret set cloudflare）
  cloudflare:
    apiKey:
      domains:
        - api.cloudflare.com
  # sandbox 内で doppler CLI を使う場合のみ。ホスト側で解決する使い方には不要。
  # 値は未投入（後で: sbx secret set doppler）
  doppler:
    apiKey:
      domains:
        - api.doppler.com

# MCP servers shared by every sandbox through the sbx MCP gateway. Credentials
# stay on the host: nothing below puts a token inside a sandbox.
#   artifactshare … remote server (OAuth). Host-global registration, so it is
#                   authorized once on the host and survives `sbx env rm`:
#                     sbx mcp auth artifactshare
# macOS-only servers live in sbxenv.mac.yaml; sbx appends its list to this one.
mcp:
  servers:
    - name: artifactshare
      url: https://artifactshare.com/mcp
