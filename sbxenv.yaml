schemaVersion: "1"

# Common sbx environment (Windows and macOS). One command builds the template
# images (the pstack conversion runs inside the opencode image build) and
# creates the sandbox. This file alone is the Windows setup. On macOS, layer
# sbxenv.mac.yaml on top for the host-only extras (see that file), e.g.:
#   sbx env run sbx-setup/sbxenv.yaml sbx-setup/sbxenv.mac.yaml \
#     --name common-opencode --env-arg workspace=$HOME/projects
# The examples below use the Windows workspace path.
#
#   OpenCode:
#     sbx env run sbx-setup/sbxenv.yaml --name common-opencode \
#       --env-arg workspace=%USERPROFILE%\projects
#
#   Codex:
#     sbx env run sbx-setup/sbxenv.yaml --name common-codex \
#       --env-arg agent=codex --env-arg template=common-codex:dev \
#       --env-arg workspace=%USERPROFILE%\projects
#
#   Claude Code:
#     sbx env run sbx-setup/sbxenv.yaml --name common-claude \
#       --env-arg agent=claude --env-arg template=common-claude:dev \
#       --env-arg workspace=%USERPROFILE%\projects
#
# lifecycle.initialize runs on the host before the sandbox is created, so the
# build + load happen as part of the same command. sbx has no build verb and
# its runtime does not share the host Docker image store, so the images are
# built with buildx, exported with `docker image save`, and imported with
# `sbx template load`.

args:
  agent:
    default: opencode
    enum: [opencode, codex, claude]
  template:
    default: common-opencode:dev
  workspace:
    default: "."
    description: Host directory to mount as the sandbox workspace

agent: ${{ env.args.agent }}
workspace: ${{ env.args.workspace }}

sandboxOptions:
  template: ${{ env.args.template }}
  pullPolicy: never
  skills: off

# 自作 kit（common-opencode / common-codex / common-claude）が credential@1 で github を
# 宣言しているため、その注入ドメインを承認する（opencode / codex / claude 共通）。
# 承認は host 全体の credentials.yaml にマージされる（sbx env rm でも残る）。
bindings:
  github:
    apiKey:
      domains:
        - api.github.com
        - github.com
        - uploads.github.com
  # cf CLI 用。kit 記述子の credential@1 (service: cloudflare) と対になる承認。
  # 値は未投入（後で: sbx secret set cloudflare）
  cloudflare:
    apiKey:
      domains:
        - api.cloudflare.com
  # sandbox 内で doppler CLI を使う場合のみ。ホスト側で解決する使い方には不要。
  # 値は未投入（後で: sbx secret set doppler）
  doppler:
    apiKey:
      domains:
        - api.doppler.com

# MCP servers shared by every sandbox through the sbx MCP gateway. Credentials
# stay on the host: nothing below puts a token inside a sandbox.
#   artifactshare … remote server (OAuth). Host-global registration, so it is
#                   authorized once on the host and survives `sbx env rm`:
#                     sbx mcp auth artifactshare
# macOS-only servers live in sbxenv.mac.yaml; sbx appends its list to this one.
mcp:
  servers:
    - name: artifactshare
      url: https://artifactshare.com/mcp

lifecycle:
  initialize:
    - name: Build templates (parallel via bake; opencode conversion runs inside)
      command: docker buildx bake
      workdir: ${{ env.fileDir }}
    - name: Save templates (single tar)
      command: docker image save common-opencode:dev common-codex:dev common-claude:dev -o "${{ env.fileDir }}/templates.tar"
    - name: Load templates into sbx (single tar)
      command: sbx template load "${{ env.fileDir }}/templates.tar"
