name: nix

# Validate the Nix flake: it declares the repo toolchain (devShell) and packages
# the CLIs that are not in nixpkgs (waza / ax / sisakulint / depgraph). Not a required
# check; it is a signal.

on:
  pull_request:
    branches: [main]
    paths:
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/nix.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  flake:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build pinned CLIs (fixed-output derivations)
        run: nix build --no-link .#waza .#ax .#sisakulint .#depgraph .#nodejs-official

      - name: Check flake
        run: nix flake check

      - name: Dev shell smoke test
        run: |
          nix develop -c bash -c 'node --version && go version && lefthook version && betterleaks version && sisakulint -version'
