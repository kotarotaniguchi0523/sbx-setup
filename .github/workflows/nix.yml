name: nix

# Validate the Nix flake: it declares the repo toolchain (devShell) and packages
# the CLIs that are not in nixpkgs (waza / ax / sisakulint). Not a required
# check; it is a signal.

on:
  pull_request:
    paths:
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/nix.yml"
  push:
    branches: [main]
    paths:
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/nix.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flake:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build pinned CLIs (fixed-output derivations)
        run: nix build --no-link .#waza .#ax .#sisakulint

      - name: Check flake
        run: nix flake check

      - name: Dev shell smoke test
        run: |
          nix develop -c bash -c 'node --version && go version && lefthook version && betterleaks version && sisakulint -version'
