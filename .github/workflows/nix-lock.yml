name: nix-lock

# Generate / refresh flake.lock (pins nixpkgs). Run manually; it opens a PR.
# Nix cannot run on the Windows dev host, so the lock is produced here.
# Renovate keeps flake.lock up to date afterwards.

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  lock:
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
      pull-requests: write
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: nix flake update
        run: nix flake update

      - name: Validate updated flake before opening PR
        run: nix flake check

      - name: Open a pull request with flake.lock
        id: pr
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          sign-commits: true
          branch: chore/nix-flake-lock
          delete-branch: true
          title: "chore: update flake.lock"
          commit-message: "chore: update flake.lock"
          body: |
            Automated `nix flake update` (refreshes the pinned nixpkgs revision).
          add-paths: |
            flake.lock

      # Dispatch only checks that are missing or failed at the current PR SHA.
      # GITHUB_TOKEN-created pull_request runs can remain approval-required.
      - name: Start CI without maintainer approval
        if: ${{ steps.pr.outputs.pull-request-number }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
        run: node tools/dispatch-pr-ci.mjs "$PR_NUMBER" chore/nix-flake-lock nix
