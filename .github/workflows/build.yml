name: build

# Build the sbx template images and push them to GHCR.
# The opencode image runs the pstack conversion inside its build.
# Consumers pull with: sbx run --template ghcr.io/<owner>/common-opencode:dev
#
# The images only build when build-relevant paths change; a `changes` job detects
# that and a small aggregator job named `build` always runs, so the required
# "build" status check is always reported (GitHub blocks PRs whose required check
# is never reported). The two images build in parallel (matrix -> one runner
# each). A registry cache in GHCR keeps the large Nix-store layers warm. All
# actions are pinned to commit SHAs (Renovate keeps them updated).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  changes:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.filter.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            build:
              - 'common-opencode/**'
              - 'common-codex/**'
              - 'pstack-opencode/**'
              - 'tools/**'
              - 'flake.nix'
              - 'flake.lock'
              - 'docker-bake.hcl'
              - '.github/workflows/build.yml'

  image:
    permissions:
      contents: read
      packages: read
    name: image (${{ matrix.name }})
    needs: changes
    if: ${{ github.event_name != 'push' && (needs.changes.outputs.build == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: opencode
            context: .
            file: common-opencode/common-opencode.yaml
            image: common-opencode
            scope: opencode
          - name: codex
            context: .
            file: common-codex/common-codex.yaml
            image: common-codex
            scope: codex
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          provenance: false
          sbom: false
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:dev
          # Registry cache lives in GHCR (no GHA size limit, which was evicting
          # the large Nix-store layer); GHA cache stays as a secondary.
          cache-from: |
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:buildcache
            type=gha,scope=${{ matrix.scope }}

  image-publish:
    permissions:
      contents: read
      packages: write
    name: publish (${{ matrix.name }})
    needs: changes
    if: ${{ github.event_name == 'push' && needs.changes.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: opencode
            context: .
            file: common-opencode/common-opencode.yaml
            image: common-opencode
            scope: opencode
          - name: codex
            context: .
            file: common-codex/common-codex.yaml
            image: common-codex
            scope: codex
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ github.event_name == 'push' }}
          provenance: ${{ github.event_name == 'push' }}
          sbom: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:dev
          # Registry cache lives in GHCR (no GHA size limit, which was evicting
          # the large Nix-store layer); GHA cache stays as a secondary.
          cache-from: |
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:buildcache
            type=gha,scope=${{ matrix.scope }}
          cache-to: |
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:buildcache,mode=max
            type=gha,mode=max,scope=${{ matrix.scope }}

  # Aggregator so the required status check stays a single, stable "build".
  build:
    permissions: {}
    needs: [changes, image, image-publish]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate result
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          BUILD_REQUIRED: ${{ needs.changes.outputs.build }}
          IMAGE_RESULT: ${{ needs.image.result }}
          PUBLISH_RESULT: ${{ needs['image-publish'].result }}
        run: |
          set -euo pipefail
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::change detection: $CHANGES_RESULT"
            exit 1
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$BUILD_REQUIRED" = "true" ]; then
            result="$IMAGE_RESULT"
            if [ "$EVENT_NAME" = "push" ]; then result="$PUBLISH_RESULT"; fi
            if [ "$result" != "success" ]; then
              echo "::error::image builds: $result"
              exit 1
            fi
            echo "images built"
          else
            echo "no build-relevant changes; image build skipped"
          fi
