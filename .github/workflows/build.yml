name: build

# Build the sbx template images and push them to GHCR.
# The opencode image runs the pstack conversion inside its build.
# Consumers pull with: sbx run --template ghcr.io/<owner>/common-opencode:dev
#
# All actions are pinned to commit SHAs (Renovate keeps them updated).

on:
  push:
    branches: [main]
    paths:
      - "common-opencode/**"
      - "common-codex/**"
      - "pstack-opencode/**"
      - "docker-bake.hcl"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push opencode
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: common-opencode/common-opencode.yaml
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/common-opencode:dev

      - name: Build and push codex
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./common-codex
          file: ./common-codex/common-codex.yaml
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/common-codex:dev
