name: build

# Build the sbx template images and push them to GHCR.
# The opencode image runs the pstack conversion inside its build.
# Consumers pull with: sbx run --template ghcr.io/<owner>/common-opencode:dev
#
# Only affected images build; the `changes` job detects
# that and a small aggregator job named `build` always runs, so the required
# "build" status check is always reported (GitHub blocks PRs whose required check
# is never reported). The two images build in parallel (matrix -> one runner
# each). A registry cache in GHCR keeps the large Nix-store layers warm. All
# actions are pinned to commit SHAs (Renovate keeps them updated).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      image:
        description: "Which sandbox image to build without publishing"
        type: choice
        required: true
        default: both
        options:
          - both
          - opencode
          - codex

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  changes:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-26.04
    outputs:
      targets: ${{ steps.matrix.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            opencode:
              - 'common-opencode/**'
              - 'pstack-opencode/**'
              - 'tools/npm/opencode/**'
            codex:
              - 'common-codex/**'
            shared:
              - 'tools/npm/cli/**'
              - 'flake.nix'
              - 'flake.lock'
              - '.dockerignore'
              - '.github/workflows/build.yml'
      - name: Generate image matrix
        id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          IMAGE_CHOICE: ${{ inputs.image || 'both' }}
          OPENCODE: ${{ steps.filter.outputs.opencode }}
          CODEX: ${{ steps.filter.outputs.codex }}
          SHARED: ${{ steps.filter.outputs.shared }}
        shell: bash
        run: |
          set -euo pipefail
          targets='[]'
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$IMAGE_CHOICE" == "opencode" ]]; then
            targets='[{"name":"opencode","file":"common-opencode/common-opencode.yaml","image":"common-opencode","scope":"opencode"}]'
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$IMAGE_CHOICE" == "codex" ]]; then
            targets='[{"name":"codex","file":"common-codex/common-codex.yaml","image":"common-codex","scope":"codex"}]'
          elif [[ "$EVENT_NAME" == "workflow_dispatch" || "$SHARED" == "true" ]]; then
            targets='[{"name":"opencode","file":"common-opencode/common-opencode.yaml","image":"common-opencode","scope":"opencode"},{"name":"codex","file":"common-codex/common-codex.yaml","image":"common-codex","scope":"codex"}]'
          elif [[ "$OPENCODE" == "true" && "$CODEX" == "true" ]]; then
            targets='[{"name":"opencode","file":"common-opencode/common-opencode.yaml","image":"common-opencode","scope":"opencode"},{"name":"codex","file":"common-codex/common-codex.yaml","image":"common-codex","scope":"codex"}]'
          elif [[ "$OPENCODE" == "true" ]]; then
            targets='[{"name":"opencode","file":"common-opencode/common-opencode.yaml","image":"common-opencode","scope":"opencode"}]'
          elif [[ "$CODEX" == "true" ]]; then
            targets='[{"name":"codex","file":"common-codex/common-codex.yaml","image":"common-codex","scope":"codex"}]'
          fi
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "Target matrix: $targets"

  image:
    permissions:
      contents: read
      packages: read
    name: image (${{ matrix.name }})
    needs: changes
    if: ${{ github.event_name != 'push' && needs.changes.result == 'success' && needs.changes.outputs.targets != '[]' }}
    runs-on: ubuntu-26.04
    cache-mode: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          provenance: false
          sbom: false
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:dev
          # Registry cache lives in GHCR (no GHA size limit, which was evicting
          # the large Nix-store layer); GHA cache stays as a secondary.
          cache-from: |
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:buildcache
            type=gha,scope=${{ matrix.scope }}

  image-publish:
    permissions:
      contents: read
      packages: write
    name: publish (${{ matrix.name }})
    needs: changes
    if: ${{ github.event_name == 'push' && needs.changes.result == 'success' && needs.changes.outputs.targets != '[]' }}
    runs-on: ubuntu-26.04
    cache-mode: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          push: ${{ github.event_name == 'push' }}
          provenance: ${{ github.event_name == 'push' }}
          sbom: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:dev
          # Registry cache lives in GHCR (no GHA size limit, which was evicting
          # the large Nix-store layer); GHA cache stays as a secondary.
          cache-from: |
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:buildcache
            type=gha,scope=${{ matrix.scope }}
          cache-to: |
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:buildcache,mode=max

  # Aggregator so the required status check stays a single, stable "build".
  build:
    permissions: {}
    needs: [changes, image, image-publish]
    if: always()
    runs-on: ubuntu-26.04
    cache-mode: none
    steps:
      - name: Evaluate result
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          TARGETS: ${{ needs.changes.outputs.targets }}
          IMAGE_RESULT: ${{ needs.image.result }}
          PUBLISH_RESULT: ${{ needs['image-publish'].result }}
        run: |
          set -euo pipefail
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::change detection: $CHANGES_RESULT"
            exit 1
          fi
          if [ "$TARGETS" != "[]" ]; then
            result="$IMAGE_RESULT"
            if [ "$EVENT_NAME" = "push" ]; then result="$PUBLISH_RESULT"; fi
            if [ "$result" != "success" ]; then
              echo "::error::image builds: $result"
              exit 1
            fi
            echo "images built"
          else
            echo "no build-relevant changes; image build skipped"
          fi
