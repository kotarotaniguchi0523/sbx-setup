name: skills-audit

# Scheduled (not per-commit) security audit of ALL agent skills.
#
# Skills are managed by APM: pstack-opencode/apm.yml declares the converted
# pstack package plus the external skill sources, and apm.lock.yaml pins every
# dependency to an exact commit + content hash. CI reproduces that set with
# `apm install --frozen` and verifies it with `apm audit --ci` (10 baseline
# checks incl. content integrity + drift).
#
# SkillSpector is folded in through APM's own external-scanner integration
# (`apm audit --external skillspector`). APM runs it offline and deterministic
# (`--no-llm`): no API key, no OpenCode credentials, no bespoke baseline file.
# Because APM always hands the scanner its whole project root, the deployed
# skills are first staged into a throwaway root that contains only skills.
#
# Results are published where humans read them: a GitHub issue titled
# "Skill security audit" (updated each run), dated reports on the `audit/skills`
# branch, and SARIF uploaded to Code Scanning. All actions are pinned to SHAs.

# Trigger policy (decided): scheduled weekly + manual only — NOT on every push
# or PR. Skill content changes at most weekly and the LLM pass costs tokens.
on:
  schedule:
    - cron: "0 0 * * 1" # Mondays 00:00 UTC = 09:00 JST
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # commit reports to the audit/skills branch
  issues: write # create/update the human-readable audit issue
  security-events: write # upload SARIF to Code Scanning

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      # APM CLI (pinned to the lockfile's apm_version) + SkillSpector via uv.
      # APM invokes SkillSpector itself, offline (no API key).
      - name: Install tooling
        shell: bash
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv tool install --python 3.12 "apm-cli==0.33.0"
          uv tool install --python 3.12 "git+https://github.com/nvidia/skillspector.git@v2.12.0"

      # Reproduce the lock-pinned skill set and verify it with APM.
      - name: Install skills (APM, frozen)
        working-directory: pstack-opencode
        run: apm install --frozen

      - name: APM audit (CI gate)
        working-directory: pstack-opencode
        run: apm audit --ci --format sarif --output "$GITHUB_WORKSPACE/apm-audit.sarif"

      # Fold SkillSpector into the audit through APM. APM always scans its whole
      # project root, so stage the deployed skills into a throwaway root first
      # (outside any apm.yml) to keep the scan bounded.
      - name: SkillSpector scan via APM (external scanner)
        id: scan
        shell: bash
        run: |
          set -euo pipefail
          apm experimental enable external-scanners
          root="$(mktemp -d)"
          cp -r pstack-opencode/.agents/skills/. "$root"/
          cd "$root"
          set +e
          apm audit --external skillspector --format sarif --output "$GITHUB_WORKSPACE/skillspector.sarif"
          code=$?
          set -e
          echo "exit=${code}" >> "$GITHUB_OUTPUT"
          echo "APM external scanner exit code: ${code} (0 clean, 1 critical, 2 warning, 3 infra)"

      - name: Build report
        shell: bash
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y-%m-%dT%H:%MZ)"
          version="$(sed -n 's/^version:[[:space:]]*//p' pstack-opencode/apm.yml | head -1)"
          upstream="$(jq -r '.repository + "@" + ((.ref // "unknown")[0:12])' pstack-opencode/SOURCE.json)"
          {
            echo "# Skill security audit · ${stamp}"
            echo
            echo "**Version** \`pstack-opencode ${version:-unknown}\` · upstream \`${upstream}\`"
            echo "**Scanner** APM external scanner — \`apm audit --external skillspector\` (offline, deterministic)"
            echo
            echo "## APM audit (lock-pinned skill set)"
            echo
            echo "\`apm install --frozen\` + \`apm audit --ci\` (10 baseline checks). See the \`apm-audit\` SARIF in Code Scanning."
            echo
            echo "## SkillSpector findings"
            echo
            echo "- \`apm audit --external\` exit: ${{ steps.scan.outputs.exit }} (\`0\` clean, \`1\` critical, \`2\` warning, \`3\` infrastructure)"
            echo "- Total: $(jq '[.runs[].results[]?] | length' skillspector.sarif)"
            echo
            echo "| Level | Rule | Count |"
            echo "|---|---|---|"
            jq -r '[.runs[].results[]? | {level: (.level // "?"), rule: (.ruleId // "?")}] | group_by([.level, .rule]) | map({level: .[0].level, rule: .[0].rule, n: length}) | sort_by(-.n) | .[] | "| `\(.level)` | `\(.rule)` | \(.n) |"' skillspector.sarif
            echo
            echo "### Details"
            echo
            echo "| Severity | Rule | Location |"
            echo "|---|---|---|"
            jq -r '.runs[].results[]? | "| " + (.level // "?") + " | " + (.ruleId // "?") + " | " + (.locations[0].physicalLocation.artifactLocation.uri // "") + (if (.locations[0].physicalLocation.region.startLine // null) then ":" + (.locations[0].physicalLocation.region.startLine|tostring) else "" end) + " |"' skillspector.sarif
            echo
            echo "## Rules"
            echo
            echo "- Periodic audit is informational: **infrastructure errors only** fail the job (exit 3); critical/warning are reported."
            echo "- Scanner: the APM external-scanner contract (\`skillspector scan --format sarif --no-llm\`); no bespoke baseline."
          } > report.md
          cat report.md

      # Publish to a human-readable place (issue created once, updated each run).
      - name: Update the audit issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh label create skill-audit --color BFD4F2 --description "Skill security audit" 2>/dev/null || true
          number="$(gh issue list --label skill-audit --state open --json number --jq '.[0].number' || true)"
          if [ -n "${number}" ]; then
            gh issue edit "${number}" --body-file report.md
            echo "Updated issue #${number}"
          else
            gh issue create --title "Skill security audit" --label skill-audit --body-file report.md
          fi

      # Persist outside CI.
      - name: Save reports to the audit/skills branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git fetch origin audit/skills:refs/heads/audit/skills 2>/dev/null; then
            git switch audit/skills
          else
            git switch --orphan audit/skills
          fi
          stamp="$(date -u +%Y%m%d-%H%M)"
          mkdir -p audit/skills
          cp report.md "audit/skills/report-${stamp}.md"
          cp report.md audit/skills/latest.md
          cp skillspector.sarif "audit/skills/skillspector-${stamp}.sarif"
          [ -f apm-audit.sarif ] && cp apm-audit.sarif "audit/skills/apm-audit-${stamp}.sarif" || true
          git add audit/skills
          if ! git diff --cached --quiet; then
            git commit -m "audit(skills): ${stamp}"
            git push origin audit/skills
          fi

      - name: Upload APM audit SARIF to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: apm-audit.sarif
          category: apm-audit

      - name: Upload SkillSpector SARIF to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: skillspector.sarif
          category: skillspector

      # Gate: the scheduled full-set audit reports; it fails only on an
      # infrastructure error (exit 3). Critical findings are surfaced in the
      # issue and Code Scanning, not used to redden the periodic run.
      - name: Gate on infrastructure errors
        shell: bash
        run: |
          set -euo pipefail
          code="${{ steps.scan.outputs.exit }}"
          errors="$(jq '[.runs[].results[]? | select(.level == "error")] | length' skillspector.sarif 2>/dev/null || echo 0)"
          echo "APM external scanner exit=${code}; error-level findings=${errors}"
          if [ "${code}" = "3" ]; then
            echo "::error::APM external scanner reported an infrastructure error (exit 3)"
            exit 1
          fi
