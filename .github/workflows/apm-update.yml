name: apm-update

# Periodic update of the external skills: `apm update` re-resolves the refs in
# pstack-opencode/apm.yml to their latest commits and rewrites
# pstack-opencode/apm.lock.yaml. The change is verified through APM's
# external-scanner integration (`apm audit --external skillspector` on the
# delta), posted as a PR comment, and gated on critical findings only.
#
# Renovate's APM manager skips entries without #<ref>. This workflow owns
# updates of the default-branch dependencies used by this project.

on:
  schedule:
    - cron: "30 3 * * 1" # Mondays 03:30 UTC (12:30 Asia/Tokyo)
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  update:
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
      pull-requests: write
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      # APM runs SkillSpector itself, offline (no API key, no opencode_cli).
      - name: Install tooling
        shell: bash
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv tool install --python 3.13 "apm-cli==0.33.0"
          uv tool install --python 3.13 "git+https://github.com/nvidia/skillspector.git@v2.12.0"

      - name: Report outdated APM dependencies
        working-directory: pstack-opencode
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: apm outdated

      - name: apm update (refresh refs, rewrite the lock)
        working-directory: pstack-opencode
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: apm update --yes

      - name: Verify the delta
        run: node tools/skills-verify.mjs --base origin/main

      - name: Open a pull request if the lockfile changed
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          sign-commits: true
          branch: chore/apm-update
          delete-branch: true
          title: "chore: update APM skill lockfile"
          commit-message: "chore: update APM skill lockfile"
          body: |
            Automated `apm update` of the pinned external skills.

            Review the `pstack-opencode/apm.lock.yaml` diff (new resolved commit
            SHAs + content hashes). The verification result is posted below.
          add-paths: |
            pstack-opencode/apm.yml
            pstack-opencode/apm.lock.yaml


      # Dispatch only checks that are missing or failed at the current PR SHA.
      # GITHUB_TOKEN-created pull_request runs can remain approval-required.
      - name: Start CI without maintainer approval
        if: ${{ steps.pr.outputs.pull-request-number }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
        run: node tools/dispatch-pr-ci.mjs "$PR_NUMBER" chore/apm-update skills

      - name: Post the verification to the pull request
        if: ${{ steps.pr.outputs.pull-request-number }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/skills-verify.mjs --post ${{ steps.pr.outputs.pull-request-number }}

      - name: Gate on critical findings
        run: node tools/skills-verify.mjs --gate
