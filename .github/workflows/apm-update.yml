name: apm-update

# Periodic update of the external skills: `apm update` re-resolves the refs in
# pstack-opencode/apm.yml to their latest commits and rewrites
# pstack-opencode/apm.lock.yaml. The change is verified with the same flow as
# any skill PR (apm install --frozen + apm audit --ci + SkillSpector on the
# delta, LLM triage via opencode_cli), posted as a PR comment, and gated on
# high-signal rules only.
#
# Renovate cannot manage APM git refs, so this workflow owns them.

on:
  schedule:
    - cron: "30 3 * * 1" # Mondays 03:30 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install tooling
        shell: bash
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv tool install --python 3.12 "apm-cli==0.33.0"
          uv tool install --python 3.12 "git+https://github.com/nvidia/skillspector.git@v2.12.0"
          pnpm add -g opencode-ai@1.18.33
          echo "$(pnpm bin -g)" >> "$GITHUB_PATH"

      - name: apm update (refresh refs, rewrite the lock)
        working-directory: pstack-opencode
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: apm update

      - name: Verify the delta
        env:
          OPENCODE_AUTH_JSON: ${{ secrets.OPENCODE_AUTH_JSON }}
          SKILLSPECTOR_MODEL: ${{ vars.SKILLSPECTOR_MODEL }}
        run: node tools/skills-verify.mjs --base origin/main

      - name: Open a pull request if the lockfile changed
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: chore/apm-update
          delete-branch: true
          title: "chore: update APM skill lockfile"
          commit-message: "chore: update APM skill lockfile"
          body: |
            Automated `apm update` of the pinned external skills.

            Review the `pstack-opencode/apm.lock.yaml` diff (new resolved commit
            SHAs + content hashes). The verification result is posted below.
          add-paths: |
            pstack-opencode/apm.lock.yaml

      - name: Post the verification to the pull request
        if: ${{ steps.pr.outputs.pull-request-number }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/skills-verify.mjs --post ${{ steps.pr.outputs.pull-request-number }}

      - name: Gate on high-signal rules
        run: node tools/skills-verify.mjs --gate
