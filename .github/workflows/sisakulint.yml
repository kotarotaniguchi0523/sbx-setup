name: sisakulint

# Security-focused static analysis for .github/workflows/ (OWASP Top 10 CI/CD
# risks). Runs the repo-local sisakulint (same tool as the pre-commit hook),
# renders findings as inline annotations, uploads SARIF to Code Scanning with
# codeql-action v4, and fails on high/critical findings.
#
# The SARIF upload runs only when there are results: the pinned sisakulint-action
# additionally emits an empty SARIF file (no "results" array) on a clean run,
# which Code Scanning rejects.
#
# All actions are pinned to commit SHAs (Renovate keeps them updated).

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/sisakulint.yaml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/sisakulint.yaml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write # upload SARIF to Code Scanning

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # Repo-local sisakulint (installs itself under .tools/). Emits SARIF.
      - name: Generate SARIF
        id: sarif
        shell: bash
        run: |
          node tools/sisakulint.mjs -format "{{sarif .}}" > sisakulint.sarif || true
          if jq -e '(.runs[0].results // []) | length > 0' sisakulint.sarif >/dev/null 2>&1; then
            echo "has_results=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_results=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload SARIF to Code Scanning
        if: steps.sarif.outputs.has_results == 'true'
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: sisakulint.sarif
          category: sisakulint

      # Policy gate + inline annotations. SARIF upload is left to the step above
      # (this action's own upload uses the deprecated CodeQL v3 and rejects empty
      # results).
      - uses: sisaku-security/sisakulint-action@8bfb3391a591a44a73b59acac86f8644112e383f # v1.0.0
        with:
          fail-on: high
          upload-sarif: false
          args: -ignore deprecated-node-runtime
