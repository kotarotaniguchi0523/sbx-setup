name: sisakulint

# Security-focused static analysis for .github/workflows/ (OWASP Top 10 CI/CD
# risks). Findings are rendered as inline PR annotations. Actions are pinned to
# commit SHAs.
#
# NOTE: upload-sarif is disabled because the pinned sisakulint-action uploads a
# SARIF file that omits the "results" array when there are no findings, which
# GitHub Code Scanning rejects ("Invalid SARIF. Missing 'results' array").
# Re-enable it (plus permissions.security-events: write) once the action is fixed.

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/sisakulint.yaml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/sisakulint.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: sisaku-security/sisakulint-action@8bfb3391a591a44a73b59acac86f8644112e383f # v1.0.0
        with:
          fail-on: high
          upload-sarif: false
          args: -ignore deprecated-node-runtime
