name: pstack-update

# Periodically check whether 本家 cursor/plugins/pstack changed, regenerate the
# OpenCode-converted package, verify the delta through APM's external-scanner
# integration (`apm audit --external skillspector`), post the result to the PR,
# and gate on critical findings. All actions are pinned to commit SHAs.

on:
  schedule:
    - cron: "17 3 * * *" # daily 03:17 UTC
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild the converted skills even if the tracked upstream directories are unchanged
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # do not cancel an in-flight PR creation

permissions: {}

jobs:
  sync:
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
      pull-requests: write
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve upstream commit
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          ref="$(git ls-remote https://github.com/cursor/plugins.git refs/heads/main | cut -f1)"
          [[ "$ref" =~ ^[a-f0-9]{40}$ ]] || { echo "::error::unable to resolve upstream commit"; exit 1; }
          # cursor/plugins hosts other plugins too: compare the tree id of every
          # directory the package is built from (pstack/ plus the extra
          # cursor-team-kit skills, keys of SOURCE.json .trees), not the
          # repository commit, so unrelated upstream commits open no PR.
          tmp="$(mktemp -d)"
          git -C "$tmp" init -q
          git -C "$tmp" fetch -q --depth 1 --filter=blob:none https://github.com/cursor/plugins.git "$ref"
          mapfile -t dirs < <(jq -r '.trees // {} | keys[]' pstack-opencode/SOURCE.json)
          [ "${#dirs[@]}" -gt 0 ] || dirs=(pstack)
          changed=false
          for d in "${dirs[@]}"; do
            # A tracked directory that disappeared upstream counts as a change;
            # the converter then fails loudly in the PR run.
            tree="$(git -C "$tmp" rev-parse -q --verify "FETCH_HEAD:$d" || echo missing)"
            old="$(jq -r --arg d "$d" '.trees[$d] // empty' pstack-opencode/SOURCE.json)"
            echo "$d: upstream $tree (recorded: ${old:-none})"
            [ "$old" = "$tree" ] || changed=true
          done
          echo "upstream $ref, changed=$changed"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - if: ${{ steps.upstream.outputs.changed == 'true' || inputs.force == true }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - if: ${{ steps.upstream.outputs.changed == 'true' || inputs.force == true }}
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # APM runs SkillSpector itself, offline (no API key, no opencode_cli).
      - name: Install tooling
        if: ${{ steps.upstream.outputs.changed == 'true' || inputs.force == true }}
        shell: bash
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv tool install --python 3.13 "apm-cli==0.33.0"
          uv tool install --python 3.13 "git+https://github.com/nvidia/skillspector.git@v2.12.0"

      - name: Regenerate the converted package from 本家 cursor/plugins/pstack
        if: ${{ steps.upstream.outputs.changed == 'true' || inputs.force == true }}
        working-directory: pstack-opencode
        env:
          PSTACK_REF: ${{ steps.upstream.outputs.ref }}
        run: node tools/convert.mjs

      - name: Verify the delta
        if: ${{ steps.upstream.outputs.changed == 'true' || inputs.force == true }}
        run: node tools/skills-verify.mjs --base origin/main

      - name: Open a pull request if 本家 changed
        if: ${{ steps.upstream.outputs.changed == 'true' || inputs.force == true }}
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          sign-commits: true
          branch: chore/pstack-upstream
          delete-branch: true
          title: "chore: sync pstack from 本家 cursor/plugins"
          commit-message: "chore: sync pstack from 本家 cursor/plugins"
          body: |
            Automated regeneration of the OpenCode-converted pstack skills from
            `cursor/plugins/pstack` (本家). Review the `.apm/` diff; the
            verification result is posted below.
          add-paths: |
            pstack-opencode/.apm
            pstack-opencode/SOURCE.json

      # Dispatch only checks that are missing or failed at the current PR SHA.
      # GITHUB_TOKEN-created pull_request runs can remain approval-required.
      - name: Start CI without maintainer approval
        if: ${{ steps.pr.outputs.pull-request-number }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
        run: node tools/dispatch-pr-ci.mjs "$PR_NUMBER" chore/pstack-upstream skills

      - name: Post the verification to the pull request
        if: ${{ steps.pr.outputs.pull-request-number }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/skills-verify.mjs --post ${{ steps.pr.outputs.pull-request-number }}

      - name: Gate on critical findings
        if: ${{ steps.upstream.outputs.changed == 'true' || inputs.force == true }}
        run: node tools/skills-verify.mjs --gate
