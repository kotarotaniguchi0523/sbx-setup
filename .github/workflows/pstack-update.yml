name: pstack-update

# Periodically check whether 本家 cursor/plugins/pstack changed, regenerate the
# OpenCode-converted package, verify the delta through APM's external-scanner
# integration (`apm audit --external skillspector`), post the result to the PR,
# and gate on critical findings. All actions are pinned to commit SHAs.

on:
  schedule:
    - cron: "17 3 * * *" # daily 03:17 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # do not cancel an in-flight PR creation

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      # APM runs SkillSpector itself, offline (no API key, no opencode_cli).
      - name: Install tooling
        shell: bash
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv tool install --python 3.13 "apm-cli==0.33.0"
          uv tool install --python 3.13 "git+https://github.com/nvidia/skillspector.git@v2.12.0"

      - name: Regenerate the converted package from 本家 cursor/plugins/pstack
        working-directory: pstack-opencode
        run: node tools/convert.mjs

      - name: Verify the delta
        run: node tools/skills-verify.mjs --base origin/main

      - name: Open a pull request if 本家 changed
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: chore/pstack-upstream
          delete-branch: true
          title: "chore: sync pstack from 本家 cursor/plugins"
          commit-message: "chore: sync pstack from 本家 cursor/plugins"
          body: |
            Automated regeneration of the OpenCode-converted pstack skills from
            `cursor/plugins/pstack` (本家). Review the `.apm/` diff; the
            verification result is posted below.
          add-paths: |
            pstack-opencode/.apm
            pstack-opencode/SOURCE.json

      - name: Post the verification to the pull request
        if: ${{ steps.pr.outputs.pull-request-number }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/skills-verify.mjs --post ${{ steps.pr.outputs.pull-request-number }}

      - name: Gate on critical findings
        run: node tools/skills-verify.mjs --gate
