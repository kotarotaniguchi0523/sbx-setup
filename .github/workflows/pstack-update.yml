name: pstack-update

# Periodically check whether 本家 cursor/plugins/pstack changed, regenerate the
# OpenCode-converted package (including the injected mapping), and open a pull
# request for review. All actions are pinned to commit SHAs.

on:
  schedule:
    - cron: "17 3 * * *" # daily 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Regenerate the converted package from 本家 cursor/plugins/pstack
        working-directory: pstack-opencode
        run: node tools/convert.mjs

      - name: Open a pull request if 本家 changed
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: chore/pstack-upstream
          delete-branch: true
          title: "chore: sync pstack from 本家 cursor/plugins"
          commit-message: "chore: sync pstack from 本家 cursor/plugins"
          body: |
            Automated regeneration of the OpenCode-converted pstack skills from
            `cursor/plugins/pstack` (本家). Review the `.apm/` diff (and the
            injected `references/opencode-tools.md`) and merge if it looks right.
          add-paths: |
            pstack-opencode/.apm
            pstack-opencode/SOURCE.json
