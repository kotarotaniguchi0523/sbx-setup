# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: workload
displayName: Common OpenCode
description: OpenCode with a pinned CLI toolchain (nix, uv, mise, gh, apm, cf, mo, difit, pnpm, node/npm, ...)

capabilities:
  - type: com.docker.sandbox/sbx@1
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - api.cloudflare.com:443
          - api.doppler.com:443
          - opencode.ai:443
          - "*.opencode.ai:443"
          - github.com:443
          - api.github.com:443
          - uploads.github.com:443
          - raw.githubusercontent.com:443
          - objects.githubusercontent.com:443
          - codeload.github.com:443
          - cache.nixos.org:443
          - nixos.org:443
          - registry.npmjs.org:443
  - type: com.docker.sandbox/credential@1
    description: GitHub API access for gh
    optional: true
    config:
      service: github
      phase: runtime
      apiKey:
        name: GH_TOKEN
        proxyManaged: true
        inject:
          - { domain: api.github.com, header: Authorization, format: "Bearer %s" }
          - { domain: uploads.github.com, header: Authorization, format: "Bearer %s" }
          - { domain: github.com, header: Authorization, format: "Bearer %s" }
  - type: com.docker.sandbox/credential@1
    description: Cloudflare API access for cf
    optional: true
    config:
      service: cloudflare
      phase: runtime
      apiKey:
        name: CLOUDFLARE_API_TOKEN
        proxyManaged: true
        inject:
          - { domain: api.cloudflare.com, header: Authorization, format: "Bearer %s" }
  - type: com.docker.sandbox/credential@1
    description: Doppler service token (sandbox-side doppler CLI)
    optional: true
    config:
      service: doppler
      phase: runtime
      apiKey:
        name: DOPPLER_TOKEN
        proxyManaged: true
        inject:
          - { domain: api.doppler.com, header: Authorization, format: "Bearer %s" }
