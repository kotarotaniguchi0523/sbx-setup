# SkillSpector baseline: accepted / known findings so that scheduled scans
# surface only NEW issues. Reviewed 2026-10-12.
#
# The converted pstack skills intentionally ship executable orchestration tooling
# and documented install commands; the scanner's static heuristics flag these,
# plus one scanner false positive (SC9). Path globs are layout-agnostic because
# the scan target is the deployed skill tree (.agents/skills).
#
# Pass with: skillspector scan <path> --baseline tools/skillspector-baseline.yaml
# A finding is suppressed when EVERY field a rule sets glob-matches it; "*"
# matches "/" as well. `reason` is required.

version: 2
scanner_version: "2.12.0"

rules:
  # Scanner false positive: every markdown document is reported as a concealed
  # executable artifact (evidence: container_depth 0, local_only true).
  - id: "SC9"
    reason: "Scanner false positive: flags every markdown document as a hidden artifact."

  # Documented Tailscale install in the upstream make-bot-ui skill.
  - id: "SC2"
    path: "*make-bot-ui*"
    reason: "Documented 'curl | sudo sh' Tailscale install in the upstream skill."
  - id: "PE2"
    path: "*make-bot-ui*"
    reason: "Same documented Tailscale install (sudo)."
  - id: "TM2"
    path: "*make-bot-ui*"
    reason: "Same documented Tailscale install (command chaining)."

  # Documented force-push in poteto-mode's autopilot playbook.
  - id: "TM1"
    path: "*autopilot-full*"
    reason: "Documented 'git push --force' in the upstream autopilot playbook."

  # Intentional upstream behaviours.
  - id: "RA1"
    path: "*reflect*"
    reason: "The reflect skill intentionally edits skills as part of learning."
  - id: "RA2"
    path: "*setup-pstack*"
    reason: "The setup skill writes agent config by design."
  - id: "EA2"
    path: "*automate-me*"
    reason: "Autonomy phrasing ('without asking') in the upstream skill description."
  - id: "AS3"
    reason: "Skills legitimately reference peer skills' SKILL.md."
  - id: "MP3"
    reason: "Word match ('clear state') in an upstream README example."
  - id: "RP1"
    reason: "README documents 'npx repomix'; the converter itself pins the version."
  - id: "SC1"
    path: "*poteto-mode*"
    reason: "Upstream devDependency uses 'latest'."

fingerprints: []
